# Publish resources/report.html, and nothing else from the repository, to
# GitHub Pages at https://xgoldy.github.io/lucidcv/report.html. Runs when
# the report changes on main, or by hand.
name: Pages

on:
  push:
    branches: [main]
    paths: ['resources/report.html']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer report replaces one still being deployed.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}report.html

    steps:
      - uses: actions/checkout@v7

      - name: Stage the report
        run: mkdir site && cp resources/report.html site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
